<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SmartOnse — Barangay Onse E-Governance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #070D18;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 400px;
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #1E293B;
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.875rem; color: #94A3B8; line-height: 1.5; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      background: #2563EB;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="width:76px;height:76px;background:#FFFFFF;border-radius:50%;margin:0 auto 16px;padding:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,0.4);">
      <img src="https://smartonse-v2.vercel.app/images/barangay-onse-seal.png" alt="Barangay Onse Seal" style="width:100%;height:100%;object-fit:contain;" />
    </div>
    <div class="spinner"></div>
    <h1>SmartOnse Mobile</h1>
    <p>Connecting to Barangay Onse Digital E-Governance server... Make sure the SmartOnse server is running or check your internet connection.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
